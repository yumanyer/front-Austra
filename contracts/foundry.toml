[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200

[profile.default.rpc_endpoints]
hyperliquid_testnet = "${HYPERLIQUID_TESTNET_RPC}"

[profile.default.etherscan]
hyperliquid = { key = "${HYPERLIQUID_SCAN_KEY}", url = "${HYPERLIQUID_SCAN_URL}" }
