server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Works for the VPS public IP and for a future domain without changing API paths.
    server_name _;

    root /opt/austral/frontend;
    index index.html;

    # Never expose dotfiles or environment files from the document root.
    location ~ /\. {
        deny all;
    }

    # The trailing slash strips /api/ before proxying to Fastify's real routes:
    # /api/health -> http://127.0.0.1:3000/health
    # /api/oracle/price/YPF -> http://127.0.0.1:3000/oracle/price/YPF
    # /api/market/YPF-PERP -> http://127.0.0.1:3000/market/YPF-PERP
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # This is a multi-page static site, not an SPA: serve physical files only.
    location / {
        try_files $uri $uri/ =404;
    }
}
